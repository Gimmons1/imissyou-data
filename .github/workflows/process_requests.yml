name: Processa Richieste Admin

on:
  issues:
    types: [opened]

concurrency:
  group: "sync-database"
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  process_admin_command:
    if: startsWith(github.event.issue.title, 'APPROVE') || startsWith(github.event.issue.title, 'DELETE') || startsWith(github.event.issue.title, 'USER_REQUEST') || startsWith(github.event.issue.title, 'ADMIN_REQUEST') || startsWith(github.event.issue.title, 'VIEW')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurazione Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Installa dipendenze
        run: pip install requests

      - name: Esecuzione comando
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: python request_processor.py

      - name: Sincronizzazione Database
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "⚡ Database Sync"
          file_pattern: "library.json analytics.json tokens.json"
          push_options: '--force'

      - name: Chiudi segnalazione
        uses: peter-evans/close-issue@v3
        with:
          issue-number: ${{ github.event.issue.number }}
          comment: "✅ Elaborato."
